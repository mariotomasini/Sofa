{% extends "base.html" %}
{% block titolo %}Download{% endblock %}
{% block contenuto %}
<h1 class="titolo-pagina"><span class="rivela"><span>Download</span></span></h1>
<p class="sottotitolo">Si aggiorna da sola. Tocca una locandina per vedere ogni file</p>
<p id="riassunto-download" class="riassunto-download" aria-live="polite"></p>
<section id="ora" class="blocco ora" aria-label="In download adesso" hidden></section>
<div id="griglia-download" class="griglia-download" aria-live="polite"><p class="caricamento">Carico</p></div>
<p class="centrato"><button type="button" class="secondario" id="cerca-ora">Cerca adesso quello che manca</button></p>

<dialog id="dettaglio-download" aria-labelledby="dettaglio-titolo">
  <div class="modulo">
    <button type="button" class="chiudi-x" id="dettaglio-x" aria-label="Chiudi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div class="dettaglio-testa">
      <span id="dettaglio-copertina" class="dettaglio-copertina"></span>
      <div>
        <h2 id="dettaglio-titolo"></h2>
        <p id="dettaglio-stato" class="sottotitolo"></p>
      </div>
    </div>
    <div id="dettaglio-azioni" class="azioni-riga dettaglio-azioni" hidden></div>
    <div id="dettaglio-voci" class="elenco-download dettaglio-voci"></div>
    <div class="azioni-riga"><button type="button" class="secondario" id="dettaglio-chiudi">Chiudi</button></div>
  </div>
</dialog>

<dialog id="dialogo-associa" aria-labelledby="titolo-associa">
  <form method="dialog" class="modulo">
    <h2 id="titolo-associa">Di che film si tratta?</h2>
    <p id="associa-nome" class="sottotitolo"></p>
    <div class="cerca-film">
      <label for="associa-cerca" class="nascosto">Titolo del film</label>
      <input id="associa-cerca" type="search" placeholder="Titolo del film" autocomplete="off">
      <button type="button" id="associa-bottone">Cerca</button>
    </div>
    <div id="associa-scelte" class="scelte"></div>
    <button value="annulla" class="secondario">Chiudi</button>
  </form>
</dialog>
{% endblock %}
{% block script %}<script>avviaPaginaDownload();</script>{% endblock %}
