{% extends "base.html" %}
{% block titolo %}{{ q or "Cerca" }}{% endblock %}
{% block contenuto %}
<div class="musica">
  <form class="ricerca-musica" action="{{ base }}/musica/cerca" method="get" role="search">
    <label for="q-musica" class="nascosto">Cerca musica</label>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    <input id="q-musica" name="q" type="search" value="{{ q }}" placeholder="Cosa vuoi ascoltare?" autocomplete="off" required{% if not q %} autofocus{% endif %}>
  </form>
  <div id="risultati-musica" aria-live="polite"></div>
</div>
{% endblock %}
{% block script %}<script>avviaCercaMusica({{ q | tojson }});</script>{% endblock %}
